name: Publier un benchmark et ses checkpoints

on:
  workflow_dispatch:
    inputs:
      benchmark:
        type: choice
        description: Protocole fixé à exécuter
        default: litterature
        options: [litterature, atelier]

permissions:
  contents: write

jobs:
  benchmark-release:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      BENCHMARK: ${{ inputs.benchmark }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Réaliser les contrôles puis le protocole fixé
        run: |
          python atelier/verifier.py --module correction
          if [ "$BENCHMARK" = "litterature" ]; then
            python -m model.benchmark_modern --out runs/publication
          else
            python atelier/benchmark.py --module correction --out runs/publication --steps 240 --widths 16,24 --seeds 0,1,2
          fi
      - name: Archiver hors de l'historique Git
        run: |
          if [ "$BENCHMARK" = "litterature" ]; then
            python scripts/package_modern_benchmark.py --run runs/publication --out runs/benchmark-fr.zip
          else
            python scripts/package_benchmark.py --run runs/publication --out runs/benchmark-fr.zip
          fi
      - name: Publier les poids, sources, données et empreintes en Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "benchmark-${GITHUB_RUN_ID}" runs/benchmark-fr.zip --target "$GITHUB_SHA" --title "Banc français — ${GITHUB_SHA:0:7}" --notes-file atelier/BANC_FR.md

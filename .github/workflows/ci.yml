name: CI

on:
  push:
  pull_request:

jobs:
  database-permissions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: ci-only-postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Privilèges, RLS et sauvegarde atomique dans une base jetable
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" mkdir -p /tmp/afz/tests
          docker cp supabase "$POSTGRES_CONTAINER:/tmp/afz/supabase"
          docker cp tests/sql "$POSTGRES_CONTAINER:/tmp/afz/tests/sql"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -f /tmp/afz/tests/sql/permissions.sql

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dépendances Python
        run: python -m pip install -r requirements.txt

      - name: pytest
        run: python -m pytest

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Dépendances Node
        run: npm ci

      - name: Tests unitaires JavaScript
        run: npm test

      - name: Validation HTML
        run: npm run validate:html

      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: npm run test:e2e

      - name: Python et NumPy réels dans Chromium
        run: npm run test:python-runtime

      - name: Lighthouse
        run: CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npm run lighthouse

      - name: Lighthouse pages lourdes
        run: CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npm run lighthouse
        env:
          LIGHTHOUSE_ROUTES: '["/#/playground","/#/ide","/#/atelier","/#/positionnement","/#/harness","/#/harness/lecon/h6.3"]'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapports
          path: |
            docs/images/*.png
            lighthouse-report.json
            playwright-report/
            playwright-runtime-report/
          if-no-files-found: ignore

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test tests/e2e/responsive.spec.js tests/e2e/workspace.spec.js tests/e2e/atelier.spec.js tests/e2e/local.spec.js tests/e2e/reliability.spec.js tests/e2e/lesson-loading.spec.js tests/e2e/visual-learning.spec.js tests/e2e/organisation.spec.js tests/e2e/course-improvements.spec.js tests/e2e/mastery.spec.js tests/e2e/harness.spec.js
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - name: Python et NumPy réels
        run: npm run test:python-runtime
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: python-runtime-${{ matrix.browser }}
          path: playwright-runtime-report/
          if-no-files-found: ignore

  torch-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Logits, loss et tous les gradients NumPy/PyTorch
        run: python -m pytest tests/test_torch_parity.py -q

name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances Python
        run: python -m pip install -r requirements.txt

      - name: pytest
        run: python -m pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dépendances Node
        run: npm ci

      - name: Tests unitaires JavaScript
        run: npm test

      - name: Validation HTML
        run: npm run validate:html

      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: npm run test:e2e

      - name: Lighthouse
        run: CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npm run lighthouse

      - name: Lighthouse pages lourdes
        run: CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npm run lighthouse
        env:
          LIGHTHOUSE_ROUTES: '["/#/playground","/#/ide","/#/atelier"]'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports
          path: |
            docs/images/*.png
            lighthouse-report.json
            playwright-report/
          if-no-files-found: ignore

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test tests/e2e/responsive.spec.js tests/e2e/workspace.spec.js tests/e2e/atelier.spec.js
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}

  torch-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Logits, loss et tous les gradients NumPy/PyTorch
        run: python -m pytest tests/test_torch_parity.py -q
